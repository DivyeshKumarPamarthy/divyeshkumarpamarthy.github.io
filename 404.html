<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page not found | Divyesh Kumar Pamarthy</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#07080b" />
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/assets/css/style.css" />
  <style>
    .nf { position: relative; z-index: 5; min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px var(--gutter); }
    .nf-face { display: grid; grid-template-columns: repeat(3, 54px); grid-auto-rows: 54px; gap: 6px; padding: 8px; border-radius: 16px; background: #050608; box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08), 0 30px 60px -20px rgba(0, 0, 0, 0.8); cursor: pointer; transition: transform 0.4s var(--ease); }
    .nf-face:hover { transform: rotate(-4deg) scale(1.03); }
    .nf-face b { border-radius: 9px; transition: background-color 0.35s, transform 0.35s var(--ease); }
    .nf-face.solved b { transform: scale(0.94); }
    .nf .eyebrow { margin-top: 36px; }
    .nf h1 { margin-top: 14px; font-size: clamp(36px, 7vw, 72px); letter-spacing: -0.04em; }
    .nf p.sub { margin-top: 16px; max-width: 30em; color: var(--muted); }
    .nf .btn { margin-top: 30px; }
    .nf-hint { margin-top: 18px; font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); }
  </style>
</head>
<body>
  <div class="fx" aria-hidden="true"><div class="fx-grid"></div><div class="fx-glow fx-glow-a"></div><div class="fx-glow fx-glow-b"></div></div>
  <main class="nf">
    <div class="nf-face" id="nf-face" role="button" tabindex="0" aria-label="Solve the scrambled face"></div>
    <p class="eyebrow">Error 404</p>
    <h1>This page got scrambled.</h1>
    <p class="sub">The link may be old or mistyped. Everything you are looking for is on the main page.</p>
    <a class="btn btn-primary" href="/">Back to the portfolio</a>
    <p class="nf-hint">Tap the face to solve it</p>
  </main>
  <script>
    (function () {
      var colors = ['#f2f3f5', '#ffcf1f', '#ff3346', '#ff8417', '#2d6bff', '#14c46c'];
      var face = document.getElementById('nf-face');
      var cells = [];
      for (var i = 0; i < 9; i++) {
        var b = document.createElement('b');
        b.style.background = colors[(Math.random() * 6) | 0];
        face.appendChild(b);
        cells.push(b);
      }
      var solved = false;
      function toggle() {
        solved = !solved;
        face.classList.toggle('solved', solved);
        var target = colors[(Math.random() * 6) | 0];
        cells.forEach(function (c, n) {
          setTimeout(function () {
            c.style.background = solved ? target : colors[(Math.random() * 6) | 0];
          }, n * 70);
        });
      }
      face.addEventListener('click', toggle);
      face.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } });
    })();
  </script>
</body>
</html>
